name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFEAT_POSTGRES_PRIMARY_DATABASE_CONNECTION_URL: postgres://postgres:postgres@localhost:5432/omniflow
  DEFEAT_BETTER_AUTH_SESSION_SIGNING_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
  DEFEAT_BETTER_AUTH_PUBLIC_APPLICATION_BASE_URL: http://localhost:3000
  DEFEAT_SEED_ADMIN_EMAIL: admin@omniflow.local
  DEFEAT_SEED_ADMIN_PASSWORD: Admin@123456

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omniflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      s3:
        image: motoserver/moto:5.2.3
        ports: ["5000:5000"]
    env:
      DEFEAT_SMTP_CONNECTION_URL: smtp://127.0.0.1:2525
      DEFEAT_S3_BUCKET_NAME: omniflow-e2e
      DEFEAT_S3_ENDPOINT_URL: http://127.0.0.1:5000
      DEFEAT_S3_REGION: us-east-1
      DEFEAT_S3_ACCESS_KEY_ID: test
      DEFEAT_S3_SECRET_ACCESS_KEY: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npx tsx scripts/seed.ts --demo
      - run: npm run build
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
